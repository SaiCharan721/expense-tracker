server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://expense-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /reports/ {
    proxy_pass http://report-service:4000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
