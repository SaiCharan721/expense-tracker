name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  expense-api:
    name: expense-api (Java 17, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # integration tests start MongoDB with Testcontainers (Docker is available on ubuntu runners)
      - name: Build and test
        run: mvn -B verify

  report-service:
    name: report-service (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  frontend:
    name: frontend (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
